# Tiny scenario for the smoke test. Deliberately far below the L9 operating scale -
# a graph small enough to reason about by hand (DEVELOPMENT_GUIDE.md: "test on small
# graphs first"). Not a research configuration.

seed: 7

device: cpu

scenario:
  num_steps: 12
  tasks_per_step: 2

road:
  extent_m: 800.0
  blocks_x: 2
  blocks_y: 2

topology:
  num_rsus: 4
  num_backhaul_segments: 2
  placement_jitter_m: 10.0
  coverage_radius_m: 400.0
  rsu_link_radius_m: 600.0
  segment_swap_prob: 0.0     # too few RSUs for the swap noise to be meaningful
  min_swap_fraction: 0.0     # and too few to satisfy a floor without emptying a segment
  min_segment_size: 2

mobility:
  source: synthetic_road
  num_vehicles: 5
  dt_s: 1.0
  speed_mean_mps: 12.0
  speed_std_mps: 3.0
  speed_min_mps: 5.0
  speed_max_mps: 20.0
  speed_jitter_mps: 0.5
  intersection_stop_prob: 0.2
  intersection_stop_mean_s: 5.0
  straight_preference: 3.0

graph:
  rsu_capacity_vehicles: 4.0
  link_age_norm_s: 30.0
  dwell_norm_s: 30.0
  speed_norm_mps: 20.0

model:
  hidden_dim: 8
  num_layers: 2

selection:
  alpha: 1.0
  beta: 0.5
  gamma: 0.3
